<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img"><title>Build, observe, evaluate, improve; a decorative process illustration</title><style>text{font-family:Arial,Helvetica,sans-serif}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><rect x="1" y="1" width="598" height="388" rx="22" fill="#f8f9fd" stroke="#e5e9f1"/><text x="30" y="43" fill="#5146d7" font-size="18" letter-spacing="2">BUILD WITH INTENT</text><path d="M150 110H450V270H150Z" fill="none" stroke="#e5e9f1" stroke-width="3"/><circle class="motion" r="5" fill="#9990e7"><animateMotion path="M150 110H450V270H150Z" dur="16s" repeatCount="indefinite"/></circle><circle cx="150" cy="110" r="29" fill="white" stroke="#5146d7"/><text x="150" y="118" fill="#5146d7" font-size="22" text-anchor="middle">01</text><text x="150" y="173" fill="#243149" font-size="22" text-anchor="middle">BUILD</text><circle cx="450" cy="110" r="29" fill="white" stroke="#5146d7"/><text x="450" y="118" fill="#5146d7" font-size="22" text-anchor="middle">02</text><text x="450" y="173" fill="#243149" font-size="22" text-anchor="middle">OBSERVE</text><circle cx="450" cy="270" r="29" fill="white" stroke="#5146d7"/><text x="450" y="278" fill="#5146d7" font-size="22" text-anchor="middle">03</text><text x="450" y="333" fill="#243149" font-size="22" text-anchor="middle">EVALUATE</text><circle cx="150" cy="270" r="29" fill="white" stroke="#5146d7"/><text x="150" y="278" fill="#5146d7" font-size="22" text-anchor="middle">04</text><text x="150" y="333" fill="#243149" font-size="22" text-anchor="middle">IMPROVE</text></svg>